    <script>
      (function() {
        // 1. Filter out Vite WebSocket HMR logs from console
        const origError = console.error;
        const origWarn = console.warn;
        console.error = function(...args) {
          const str = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
          if (str.includes('WebSocket') || str.includes('[vite]') || str.includes('closed without opened')) {
            return;
          }
          origError.apply(console, args);
        };
        console.warn = function(...args) {
          const str = args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' ');
          if (str.includes('WebSocket') || str.includes('[vite]')) {
            return;
          }
          origWarn.apply(console, args);
        };

        // 2. Intercept unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = String(event.reason || '') + ' ' + String(event.reason?.message || '') + ' ' + String(event.reason?.stack || '');
          if (reasonStr.includes('WebSocket') || reasonStr.includes('vite') || reasonStr.includes('closed without opened')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // 3. Intercept window errors
        window.addEventListener('error', function(event) {
          const msg = String(event.message || '') + ' ' + String(event.filename || '');
          if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('closed without opened')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
